<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sotobosquejo</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#171717;background:#f3f4f6}
*{box-sizing:border-box}body{margin:0;padding:14px}.app{max-width:760px;margin:auto}.card{background:white;border:1px solid #ddd;border-radius:18px;padding:14px;margin-bottom:12px}
h1{margin:0 0 5px;font-size:25px}.muted{color:#666;font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}
input,select,button{font:inherit;min-height:44px;border-radius:11px;border:1px solid #ccc;padding:8px 12px}button{background:#fff;font-weight:650}button.primary{background:#111;color:white;border-color:#111}button.danger{background:#fff;color:#b91c1c;border-color:#ef4444}button:disabled{opacity:.4}
#boardWrap{background:#fff;border:2px solid #333;border-radius:12px;overflow:hidden;touch-action:none;overscroll-behavior:contain}
#board{display:block;width:100%;background:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
.colors button{width:44px;height:44px;padding:0;border-radius:50%;border:3px solid #ddd}.colors button.sel{border-color:#111;box-shadow:inset 0 0 0 3px white}
.timer{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}.score{font-size:18px;font-weight:700}.hidden{display:none!important}
#status{font-weight:650}.secret{font-size:28px;font-weight:850;text-align:center;padding:8px}.tools button.active{background:#111;color:white}.guessSeen{margin-top:10px;padding:12px;border-radius:12px;background:#f3f4f6;border:1px solid #ddd;font-size:18px}.guessSeen strong{display:block;font-size:13px;color:#666;margin-bottom:3px}
@media(max-width:500px){body{padding:8px}.card{padding:11px}.hideMobile{display:none}}
</style>
</head>
<body><main class="app">
<section class="card">
<h1>Sotobosquejo</h1>
<div class="muted">Partida local · 2 celulares · misma Wi‑Fi</div>
<div id="joinArea" class="row" style="margin-top:12px">
<input id="name" class="grow" placeholder="Tu nombre" maxlength="24">
<button id="join" class="primary">Entrar</button>
</div>
<div id="lobby" class="hidden">
<div class="row" style="justify-content:space-between;margin-top:12px"><div id="players"></div><div id="scores" class="score"></div></div>
<div id="hostSettings" class="hidden" style="margin-top:12px">
<div class="row">
<select id="category"><option value="facil">Fáciles</option><option value="comida">Comida</option><option value="acciones">Acciones</option><option value="animales">Animales</option><option value="objetos">Objetos</option><option value="lugares">Lugares</option></select>
<select id="guessSeconds"><option value="30">30 s para responder</option><option value="20">20 s para responder</option></select>
<button id="start" class="primary">Empezar partida</button>
</div></div></div>
</section>

<section id="game" class="card hidden">
<div class="row" style="justify-content:space-between"><div><div class="muted">Estado</div><div id="role" style="font-weight:800"></div></div><div style="text-align:right"><div class="muted">Tiempo</div><div id="timer" class="timer">01:00</div></div></div>
<div id="secretBox" class="hidden"><div class="muted" style="text-align:center;margin-top:8px">Tu palabra</div><div id="secret" class="secret"></div></div>
<div id="tools" class="tools hidden" style="margin:10px 0">
<div class="row"><button data-size="6" class="active brush">Fino</button><button data-size="16" class="brush">Grueso</button><button id="fill">Rellenar</button><button id="clear">Borrar</button></div>
<div class="colors row" style="margin-top:8px">
<button data-color="#dc2626" style="background:#dc2626" aria-label="Rojo"></button>
<button data-color="#facc15" style="background:#facc15" aria-label="Amarillo"></button>
<button data-color="#16a34a" style="background:#16a34a" aria-label="Verde"></button>
<button data-color="#2563eb" style="background:#2563eb" aria-label="Azul"></button>
<button data-color="#111111" class="sel" style="background:#111111" aria-label="Negro"></button>
<button data-color="#7e22ce" style="background:#7e22ce" aria-label="Violeta"></button>
</div></div>
<div id="boardWrap"><canvas id="board" width="700" height="480"></canvas></div>
<button id="send" class="primary hidden" style="width:100%;margin-top:10px">Enviar dibujo</button>
<form id="guessForm" class="row hidden" style="margin-top:10px"><input id="guess" class="grow" placeholder="¿Qué es?"><button class="primary">Adivinar</button></form>
<div id="guessSeen" class="guessSeen hidden"><strong id="guessSeenLabel">Respuesta recibida</strong><span id="guessSeenText"></span></div>
<div id="status" style="margin-top:10px"></div>
<button id="endSession" class="danger" style="width:100%;margin-top:12px">Terminar sesión</button>
</section>
</main>
<script>
const $=s=>document.querySelector(s);
let id=sessionStorage.getItem('sotobosquejo-id')||'',joined=false,lastVersion=-1;
let brushColor='#111111',brushSize=6,tool='brush',drawing=false,last=null,renderedStrokes=0,renderedFills=0;
const canvas=$('#board'),ctx=canvas.getContext('2d');
function white(){ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height)}
white();
async function post(path,obj){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});const x=await r.json();if(!r.ok)throw new Error(x.error||'Error');return x}
function act(type,extra={}){return post('/api/action',{id,type,...extra})}
$('#join').onclick=async()=>{try{const x=await post('/api/join',{id,name:$('#name').value.trim()||'Jugador'});id=x.id;sessionStorage.setItem('sotobosquejo-id',id);joined=true;$('#joinArea').classList.add('hidden');$('#lobby').classList.remove('hidden');render(x.state)}catch(e){alert(e.message)}}
$('#category').onchange=()=>act('settings',{category:$('#category').value,guessSeconds:+$('#guessSeconds').value});
$('#guessSeconds').onchange=()=>act('settings',{category:$('#category').value,guessSeconds:+$('#guessSeconds').value});
$('#start').onclick=()=>act('start');
$('#send').onclick=()=>act('send');
$('#endSession').onclick=async()=>{if(confirm('¿Terminar esta sesión y volver a elegir rubro?'))await act('end_session')};
$('#clear').onclick=()=>act('clear');
$('#fill').onclick=()=>{tool='fill';document.querySelectorAll('.tools button').forEach(b=>b.classList.remove('active'));$('#fill').classList.add('active')};
document.querySelectorAll('.brush').forEach(b=>b.onclick=()=>{tool='brush';brushSize=+b.dataset.size;document.querySelectorAll('.tools button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
document.querySelectorAll('.colors button').forEach(b=>b.onclick=()=>{brushColor=b.dataset.color;document.querySelectorAll('.colors button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});
$('#guessForm').onsubmit=e=>{e.preventDefault();const g=$('#guess').value.trim();if(g){act('guess',{guess:g});$('#guess').value=''}};
function pt(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
canvas.onpointerdown=e=>{if($('#tools').classList.contains('hidden'))return;e.preventDefault();const p=pt(e);if(tool==='fill'){act('fill',{x:p.x,y:p.y,color:brushColor});return}drawing=true;last=p;canvas.setPointerCapture?.(e.pointerId)}
canvas.onpointermove=e=>{if(!drawing||!last)return;e.preventDefault();const p=pt(e),s={x1:last.x,y1:last.y,x2:p.x,y2:p.y,color:brushColor,size:brushSize};drawStroke(s);act('stroke',{stroke:s});last=p}
canvas.onpointerup=canvas.onpointercancel=e=>{e.preventDefault();drawing=false;last=null}
function drawStroke(s){ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.strokeStyle=s.color;ctx.lineWidth=s.size;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function hexRgb(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16),255]}
function flood(x,y,hex){const w=canvas.width,h=canvas.height,img=ctx.getImageData(0,0,w,h),d=img.data,ix=Math.floor(x),iy=Math.floor(y),i=(iy*w+ix)*4,t=[d[i],d[i+1],d[i+2],d[i+3]],r=hexRgb(hex);if(t.every((v,k)=>v===r[k]))return;const st=[[ix,iy]],seen=new Uint8Array(w*h);while(st.length){const [cx,cy]=st.pop();if(cx<0||cy<0||cx>=w||cy>=h)continue;const p=cy*w+cx;if(seen[p])continue;seen[p]=1;const j=p*4;if(d[j]!==t[0]||d[j+1]!==t[1]||d[j+2]!==t[2]||d[j+3]!==t[3])continue;d[j]=r[0];d[j+1]=r[1];d[j+2]=r[2];d[j+3]=255;st.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1])}ctx.putImageData(img,0,0)}
function syncCanvas(s){if(s.strokes.length<renderedStrokes||s.fillOps.length<renderedFills){white();renderedStrokes=0;renderedFills=0}
while(renderedStrokes<s.strokes.length){drawStroke(s.strokes[renderedStrokes++])}
while(renderedFills<s.fillOps.length){const f=s.fillOps[renderedFills++];flood(f.x,f.y,f.color)}
}
function render(s){
 if(!s)return;
 $('#players').textContent=s.players.map(p=>p.name).join(' vs ')||'Esperando jugadores';
 $('#scores').textContent=s.players.map(p=>(s.scores[p.id]||0)).join(' - ');
 $('#hostSettings').classList.toggle('hidden',!s.isHost||s.phase!=='lobby');
 $('#start').disabled=s.players.length<2;
 $('#category').value=s.category;$('#guessSeconds').value=String(s.guessSeconds);
 $('#game').classList.toggle('hidden',s.phase==='lobby');
 if(s.phase!=='lobby'){
   $('#role').textContent=s.isDrawer?'Te toca dibujar':'Te toca adivinar';
   $('#secretBox').classList.toggle('hidden',!s.isDrawer||s.phase!=='drawing');
   $('#secret').textContent=s.secret||'';
   $('#tools').classList.toggle('hidden',!s.isDrawer||s.phase!=='drawing');
   $('#send').classList.toggle('hidden',!s.isDrawer||s.phase!=='drawing');
   $('#guessForm').classList.toggle('hidden',s.isDrawer||s.phase!=='guessing');
   $('#timer').textContent=s.phase==='drawing'?'00:'+String(s.drawLeft).padStart(2,'0'):'00:'+String(s.guessLeft).padStart(2,'0');
   $('#status').textContent=s.message||'';

   const showGuess = s.isDrawer && !!s.lastGuess && (s.phase==='guessing' || s.phase==='result');
   $('#guessSeen').classList.toggle('hidden',!showGuess);
   if(showGuess){
     $('#guessSeenLabel').textContent='Respuesta de '+(s.lastGuesserName||'Jugador');
     $('#guessSeenText').textContent=s.lastGuess;
   }

   // Durante el turno de dibujo, el jugador que adivina ve la pizarra en blanco.
   if(s.phase==='drawing' && !s.isDrawer){
     white(); renderedStrokes=0; renderedFills=0;
   }else{
     syncCanvas(s);
   }
 }
}
setInterval(async()=>{if(!id)return;try{const r=await fetch('/api/state?id='+encodeURIComponent(id),{cache:'no-store'});const s=await r.json();if(s.version!==lastVersion){lastVersion=s.version;render(s)}else if(s.phase==='drawing'||s.phase==='guessing'){render(s)}}catch{}},250);
if(id){$('#name').value='Jugador';}
</script></body></html>
